[package]
name = "burn-jev"
version = "0.1.0"
edition = "2024"
default-run = "reflex"

[dependencies]
burn = { version = "0.21.0", features = ["train", "tui"] }
burn-flex = "0.21.0"
half = { version = "2.7.1", features = ["bytemuck"] }
bytemuck = "1"
memmap2 = "0.9"
safetensors = "0.8.0"
tokenizers = "0.23.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }

[features]
default = ["wgpu", "fusion"]
# WebGPU via wgpu (Vulkan on Linux).
wgpu = ["burn/wgpu"]
# Kernel fusion for the GPU backends.
fusion = ["burn/fusion"]
cuda = ["burn/cuda"]

# Optimize dependencies (burn-flex kernels, gemm, half) even in debug builds;
# unoptimized tensor kernels dominate runtime otherwise.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "backend_parity"
required-features = ["wgpu"]
